name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deny:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # Becomes required once the first findings are resolved.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v5
        id: deny-cache
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-0.18.4
      - name: Install pinned cargo-deny
        if: steps.deny-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.18.4
      - run: cargo fetch --locked
      - run: cargo deny --version
      - run: cargo deny check
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Fetch every locked crate (tests resolve the workspace offline)
        run: cargo fetch --locked
      - run: tools/ci.sh
  rpm:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        el: ["8.8", "8.10"]
    container: rockylinux/rockylinux:${{ matrix.el }}
    steps:
      - name: Pin Rocky 8.8 repositories before any installation
        if: matrix.el == '8.8'
        run: |
          sed -i -e 's|^mirrorlist=|#mirrorlist=|' \
            -e 's|^#baseurl=http://dl.rockylinux.org/\$contentdir/\$releasever/|baseurl=https://dl.rockylinux.org/vault/rocky/8.8/|' \
            /etc/yum.repos.d/*.repo
          if grep -H -E '^(mirrorlist|metalink)=' /etc/yum.repos.d/*.repo; then exit 1; fi
      - run: dnf install -y git tar
      - uses: actions/checkout@v6
      - run: tools/el8-build-env.sh ${{ matrix.el }}
      - name: Expose Cargo to subsequent steps
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-generate-rpm
          key: rpm-el${{ matrix.el }}-generator-0.20.0-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fetch --locked
      - run: cargo xtask rpm --native
      - run: tools/check-rpm.sh target/generate-rpm/tidemark-0.1.0-1.el8.x86_64.rpm
      - run: dnf install -y ./target/generate-rpm/tidemark-0.1.0-1.el8.x86_64.rpm
      - run: tidemark --version
      - run: tidemarkd --version
      - run: rpm -V tidemark
      - run: sha256sum target/generate-rpm/tidemark-0.1.0-1.el8.x86_64.rpm > target/generate-rpm/tidemark-0.1.0-1.el8.x86_64.rpm.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: tidemark-el${{ matrix.el }}-x86_64
          path: |
            target/generate-rpm/*.rpm
            target/generate-rpm/*.sha256
          if-no-files-found: error
