# Owned by: W7-C3-fuzz
[package]
name = "tidemark-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
[package.metadata]
cargo-fuzz = true
[workspace]
[dependencies]
libfuzzer-sys = "0.4"
tidemark-sys = { path = "../crates/tidemark-sys" }
tidemark-live = { path = "../crates/tidemark-live" }
tidemark-fs = { path = "../crates/tidemark-fs" }
tidemark-core = { path = "../crates/tidemark-core" }
tidemark-cli = { path = "../crates/tidemark-cli" }
tidemarkd = { path = "../crates/tidemarkd" }
tidemark-store = { path = "../crates/tidemark-store" }
serde_json = "1"
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }

[[bin]]
name = "mountinfo"
path = "fuzz_targets/mountinfo.rs"
test = false
doc = false
bench = false

