[advisories]
ignore = [
    { id = "RUSTSEC-2026-0542", reason = "2026-11-25: informational unmaintained notice for humantime, not a vulnerability; no patched version is available. Replacement is planned." },
    { id = "RUSTSEC-2026-0543", reason = "2026-11-25: informational unmaintained notice for chrono, not a vulnerability; no patched version is available. Replacement is planned." },
]

[licenses]
# xxhash-rust requires the Boost Software License (BSL-1.0).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "BSL-1.0"]

[bans]
deny = [{ name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
